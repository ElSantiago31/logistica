<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/static/frontend/logo.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Gerencia 360</title>
    <link rel="stylesheet" href="/static/frontend/tailwind.css?v=20260916">
</head>
<body class="bg-gray-50 min-h-screen">
    <script src="/static/js/auth{{ js_suffix }}.js?v=20260811"></script>

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="/static/frontend/logo.jpeg" alt="Logo" class="w-8 h-8 rounded-full object-cover">
                <span class="font-bold text-gray-800">Gerencia</span>
            </div>
            <button onclick="doLogout()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white" style="background:#785631">⏻ Cerrar Sesión</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 sm:mb-6">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Eventos — Vista Gerencia</h1>
                <p class="text-sm text-gray-500 mt-1">Monitoreo en tiempo real del avance de check-in</p>
            </div>
            <button onclick="loadEvents()" class="px-4 py-2 rounded-lg text-sm font-semibold text-white" style="background:#785631">↻ Actualizar</button>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Evento</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ubicación</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Avance check-in</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"></th>
                    </tr>
                </thead>
                <tbody id="eventsTable" class="divide-y divide-gray-200"></tbody>
            </table>
            <div id="emptyState" class="hidden p-8 text-center text-gray-500">No hay eventos registrados</div>
            <div id="pagination" class="hidden flex items-center justify-between px-4 py-3 border-t border-gray-200">
                <p id="pageInfo" class="text-xs text-gray-500"></p>
                <div class="flex items-center gap-1">
                    <button id="btnFirst" onclick="goPage(1)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 disabled:opacity-40">«</button>
                    <button id="btnPrev" onclick="goPage(state.page - 1)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-white disabled:opacity-40" style="background:#785631">‹ Anterior</button>
                    <span id="pageNumbers" class="flex items-center gap-1"></span>
                    <button id="btnNext" onclick="goPage(state.page + 1)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-white disabled:opacity-40" style="background:#785631">Siguiente ›</button>
                    <button id="btnLast" onclick="goPage(state.totalPages)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 disabled:opacity-40">»</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Guard client-side: solo gerencia/superadmin/admin (el backend valida el token)
        (function () {
            const t = localStorage.getItem('access_token');
            const u = JSON.parse(localStorage.getItem('user') || '{}');
            if (!t || !['gerencia', 'superadmin', 'admin'].includes(u.user_type)) {
                location.href = '/admin/login';
            }
        })();

        function doLogout() {
            if (!confirm('¿Cerrar sesión?')) return;
            if (window.Auth && window.Auth.logout) window.Auth.logout();
            else { localStorage.clear(); location.href = '/admin/login'; }
        }

        const STATUS = {
            draft: ['Borrador', 'bg-gray-100 text-gray-800'],
            published: ['Publicado', 'bg-blue-100 text-blue-800'],
            in_progress: ['En progreso', 'bg-amber-100 text-amber-800'],
            completed: ['Completado', 'bg-green-100 text-green-800'],
            cancelled: ['Cancelado', 'bg-red-100 text-red-800'],
        };

        function fmtDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function bar(pct) {
            const cls = pct >= 90 ? 'bg-green-600' : pct >= 50 ? 'bg-amber-500' : 'bg-red-500';
            return `<div class="flex items-center gap-2">
                <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden"><div class="${cls} h-full" style="width:${Math.min(pct, 100)}%"></div></div>
                <span class="text-xs font-semibold text-gray-700">${pct}%</span>
            </div>`;
        }

        const state = { page: 1, pageSize: 20, total: 0, totalPages: 1 };

        function goPage(p) {
            if (p < 1 || p > state.totalPages || p === state.page) return;
            state.page = p;
            loadEvents();
        }

        function renderPagination() {
            const pg = document.getElementById('pagination');
            if (state.totalPages <= 1) { pg.classList.add('hidden'); pg.classList.remove('flex'); return; }
            pg.classList.remove('hidden'); pg.classList.add('flex');
            document.getElementById('pageInfo').textContent =
                `${state.total} eventos · página ${state.page} de ${state.totalPages}`;
            document.getElementById('btnFirst').disabled = state.page === 1;
            document.getElementById('btnPrev').disabled = state.page === 1;
            document.getElementById('btnNext').disabled = state.page === state.totalPages;
            document.getElementById('btnLast').disabled = state.page === state.totalPages;
            // Números de página: ventana de 5 alrededor de la actual
            const nums = [];
            let start = Math.max(1, state.page - 2);
            let end = Math.min(state.totalPages, start + 4);
            start = Math.max(1, end - 4);
            for (let i = start; i <= end; i++) nums.push(i);
            document.getElementById('pageNumbers').innerHTML = nums.map(n =>
                `<button onclick="goPage(${n})" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold ${n === state.page ? 'text-white' : 'text-gray-600 bg-gray-100 hover:bg-gray-200'}" ${n === state.page ? 'style="background:#785631"' : ''}>${n}</button>`
            ).join('');
        }

        async function loadEvents() {
            const token = localStorage.getItem('access_token');
            try {
                const resp = await fetch(`/api/monitoring/events?page=${state.page}&page_size=${state.pageSize}`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (resp.status === 401) { location.href = '/admin/login'; return; }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                state.total = data.total;
                state.totalPages = data.total_pages;
                const events = data.items;
                const tbody = document.getElementById('eventsTable');
                const empty = document.getElementById('emptyState');
                if (!events.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); renderPagination(); return; }
                empty.classList.add('hidden');
                tbody.innerHTML = events.map(ev => {
                    const denom = ev.confirmed + ev.checked_in;
                    const pct = denom ? Math.round(ev.checked_in / denom * 100) : 0;
                    const [label, cls] = STATUS[ev.status] || [ev.status, 'bg-gray-100'];
                    return `<tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm font-semibold text-gray-800">${ev.name}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${fmtDate(ev.start_date)}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${ev.location || '—'}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${cls}">${label}</span></td>
                        <td class="px-4 py-3">${bar(pct)}<span class="text-xs text-gray-400">${ev.checked_in}/${ev.confirmed}</span></td>
                        <td class="px-4 py-3 text-right">
                            <a href="/gerencia/events/${ev.id}" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white" style="background:#785631">Monitorear</a>
                        </td>
                    </tr>`;
                }).join('');
                renderPagination();
            } catch (e) {
                console.error(e);
                document.getElementById('eventsTable').innerHTML =
                    '<tr><td colspan="6" class="px-4 py-6 text-center text-red-600 text-sm">⚠ Error al cargar eventos: ' + e.message + '</td></tr>';
            }
        }
        loadEvents();
    </script>
</body>
</html>
