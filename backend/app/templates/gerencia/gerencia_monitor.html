<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/static/frontend/logo.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo 360 - Gerencia</title>
    <link rel="stylesheet" href="/static/frontend/tailwind.css?v=20260916">
    <style>
        .ring-bg { stroke: #e5e7eb; }
        .ring-fg { transition: stroke-dashoffset .6s ease; stroke-linecap: round; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% include "gerencia/_gerencia_nav.html" %}

    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 sm:mb-6">
            <div>
                <a href="/gerencia" class="text-sm text-gray-500 hover:underline">← Eventos</a>
                <h1 id="evName" class="text-xl sm:text-2xl font-bold text-gray-800 mt-1">Cargando…</h1>
                <p id="evMeta" class="text-sm text-gray-500 mt-1"></p>
            </div>
            <div class="text-right">
                <span id="liveBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800">
                    <span class="w-2 h-2 bg-green-600 rounded-full animate-pulse"></span> EN VIVO
                </span>
                <p id="updatedAt" class="text-xs text-gray-400 mt-2"></p>
            </div>
        </div>

        <!-- Filtro por etapa -->
        <div id="stageFilter" class="flex flex-wrap gap-2 mb-4"></div>

        <!-- Anillos SVG -->
        <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6">
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <svg viewBox="0 0 120 120" class="w-24 h-24 mx-auto">
                    <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
                    <circle id="ringCheckin" class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke="#16a34a" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"/>
                </svg>
                <p class="text-2xl font-bold text-gray-800 mt-2"><span id="txtCheckin">0</span><span class="text-sm text-gray-400">/<span id="txtCheckinReq">0</span></span></p>
                <p class="text-xs text-gray-500">Check-in global</p>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <svg viewBox="0 0 120 120" class="w-24 h-24 mx-auto">
                    <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
                    <circle id="ringNoShow" class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke="#7c3aed" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"/>
                </svg>
                <p class="text-2xl font-bold text-gray-800 mt-2" id="txtNoShow">0</p>
                <p class="text-xs text-gray-500">No-show / Rechazados</p>
            </div>
        </div>

        <!-- Anillos por rol -->
        <div class="bg-white rounded-xl shadow p-4 mb-6">
            <h2 class="text-sm font-bold text-gray-700 mb-3">Avance por rol <span class="text-xs text-gray-400 font-normal">(check-ins / requeridos)</span></h2>
            <div id="roleRings" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

    </div>

    <script>
        const EVENT_ID = "{{ event_id }}";
        const CIRC = 2 * Math.PI * 52; // 326.7

        (function () {
            const t = localStorage.getItem('access_token');
            const u = JSON.parse(localStorage.getItem('user') || '{}');
            if (!t || !['gerencia', 'superadmin', 'admin'].includes(u.user_type)) {
                location.href = '/admin/login';
            }
        })();

        function setRing(id, pct) {
            const el = document.getElementById(id);
            el.setAttribute('stroke-dashoffset', CIRC * (1 - Math.min(pct, 100) / 100));
        }

        function fmtTime(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        let currentStage = null;

        function setStage(s) {
            currentStage = s;
            refresh();
        }

        function renderStages(stages) {
            const wrap = document.getElementById('stageFilter');
            if (!stages || stages.length <= 1) { wrap.innerHTML = ''; return; }
            const mk = (val, label, active) =>
                `<button onclick="setStage(${val ? `'${val}'` : 'null'})" class="px-3 py-1.5 rounded-lg text-xs font-semibold capitalize ${active ? 'text-white' : 'text-gray-600 bg-gray-100 hover:bg-gray-200'}" ${active ? 'style="background:#785631"' : ''}>${label}</button>`;
            wrap.innerHTML = [
                mk(null, 'todas las etapas', !currentStage),
                ...stages.map(s => mk(s, s, currentStage === s)),
            ].join('');
        }

        async function refresh() {
            const token = localStorage.getItem('access_token');
            try {
                const resp = await fetch(`/api/monitoring/events/${EVENT_ID}/overview${currentStage ? '?stage=' + currentStage : ''}`, {
                    headers: { 'Authorization': 'Bearer ' + token },
                });
                if (resp.status === 401) { location.href = '/admin/login'; return; }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const d = await resp.json();

                // Encabezado
                document.getElementById('evName').textContent = d.event.name;
                document.getElementById('evMeta').textContent = [
                    d.event.client_name, d.event.location,
                    d.event.start_date ? new Date(d.event.start_date).toLocaleDateString('es-CO') : null,
                ].filter(Boolean).join(' · ');
                document.getElementById('updatedAt').textContent = 'Actualizado: ' + fmtTime(d.updated_at);

                // Selector de etapa (los anillos y tablas responden a la etapa)
                renderStages(d.stages);

                // Anillos
                const t = d.totals || {};
                const needed = (d.by_role || []).reduce((a, r) => a + (r.needed || 0), 0);
                // Personal REQUERIDO (plan de personal), no los invitados
                const required = t.required || needed;

                setRing('ringCheckin', t.checkin_pct);
                document.getElementById('txtCheckin').textContent = t.checked_in;
                document.getElementById('txtCheckinReq').textContent = required;

                setRing('ringNoShow', t.assigned ? (t.no_show + t.rejected) / t.assigned * 100 : 0);
                document.getElementById('txtNoShow').textContent = t.no_show + t.rejected;

                // Anillos por rol (check-ins / requeridos del plan)
                document.getElementById('roleRings').innerHTML = (d.by_role || []).map(r => {
                    const pct = r.needed ? Math.round(r.checked_in / r.needed * 100) : 0;
                    const color = pct >= 90 ? '#16a34a' : pct >= 50 ? '#f59e0b' : '#ef4444';
                    const off = CIRC * (1 - Math.min(pct, 100) / 100);
                    return `<div class="bg-gray-50 rounded-xl p-3 text-center">
                        <svg viewBox="0 0 120 120" class="w-16 h-16 mx-auto">
                            <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
                            <circle class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke="${color}" stroke-dasharray="326.7" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
                        </svg>
                        <p class="text-base font-bold text-gray-800 mt-1">${r.checked_in}<span class="text-xs text-gray-400">/${r.needed}</span></p>
                        <p class="text-xs text-gray-600 font-semibold truncate" title="${r.role_name}">${r.role_name}</p>
                        <p class="text-[10px] text-gray-400">${r.confirmed} conf · ${r.stage}</p>
                    </div>`;
                }).join('') || '<p class="text-sm text-gray-400 col-span-full text-center py-3">Sin roles en el plan de personal</p>';
            } catch (e) {
                console.error(e);
                document.getElementById('evName').textContent = '⚠ Error al cargar datos';
                document.getElementById('evMeta').textContent = 'Revisa tu conexión o sesión: ' + e.message;
            }
        }

        refresh();
        setInterval(refresh, 10000); // EN VIVO: cada 10 s
    </script>
</body>
</html>
