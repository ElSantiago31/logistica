<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/static/frontend/logo.jpeg">
    <link rel="apple-touch-icon" href="/static/frontend/logo.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Eventos - Staff</title>
    <link rel="stylesheet" href="/static/frontend/tailwind.css?v=20260916">
<!-- Interceptor global de fetch + refresh automático de token -->
    <script src="/static/js/auth{{ js_suffix }}.js?v=20260811"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<nav style="background:linear-gradient(135deg,#5d4224,#785631)" class="text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="/static/frontend/logo.jpeg" alt="A&C" class="h-9 w-9 rounded-full object-cover border-2" style="border-color:#cf9b62;">
            <span class="font-bold text-sm" style="color:#fff2e4;">A&C Logística</span>
            <span id="roleBadge" class="text-xs px-2 py-0.5 rounded-full font-semibold"></span>
        </div>
        <div class="flex items-center gap-3">
            <span id="userName" class="text-xs sm:text-sm" style="color:#e3be95;"></span>
            <button onclick="localStorage.clear();location.href='/admin/login'" class="px-3 py-1.5 rounded-lg text-xs font-medium" style="background:#cf9b62;color:#1a1a1a">Salir</button>
        </div>
    </div>
</nav>

<div class="max-w-4xl mx-auto px-4 py-6">
    <h1 class="text-xl font-bold text-gray-800 mb-1">📅 Mis Eventos Asignados</h1>
    <p class="text-sm text-gray-500 mb-6">Solo puedes ver los eventos donde el coordinador te asignó.</p>
    <div id="eventsList" class="space-y-3">
        <div class="text-center text-gray-400 py-8">Cargando eventos...</div>
    </div>
</div>

<!-- Quick Add Modal (⚡ Incorporación Rápida) -->
<div id="quickAddModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center z-50">
    <div class="bg-white rounded-t-lg sm:rounded-lg p-4 sm:p-6 w-full sm:max-w-lg">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-base sm:text-lg font-semibold">⚡ Incorporación Rápida</h3>
            <button onclick="closeQuickAddModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <p class="text-xs text-gray-500 mb-4" id="qaEventName"></p>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <input type="text" id="qaPrimerNombre" placeholder="Primer nombre *" class="border rounded-lg px-3 py-2 text-sm">
            <input type="text" id="qaSegundoNombre" placeholder="Segundo nombre" class="border rounded-lg px-3 py-2 text-sm">
            <input type="text" id="qaPrimerApellido" placeholder="Primer apellido *" class="border rounded-lg px-3 py-2 text-sm">
            <input type="text" id="qaSegundoApellido" placeholder="Segundo apellido" class="border rounded-lg px-3 py-2 text-sm">
            <select id="qaDocType" class="border rounded-lg px-3 py-2 text-sm">
                <option value="CC">Cédula (CC)</option>
                <option value="CE">C. Extranjería (CE)</option>
                <option value="TI">Tarjeta Id. (TI)</option>
                <option value="PP">Pasaporte (PP)</option>
                <option value="PPT">Permiso Protección Temporal (PPT)</option>
            </select>
            <input type="text" id="qaDocNumber" placeholder="Número de documento *" class="border rounded-lg px-3 py-2 text-sm">
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="closeQuickAddModal()" class="px-4 py-2 border rounded-lg text-sm">Cancelar</button>
            <button id="btnQuickAdd" onclick="submitQuickAdd()" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 text-sm">⚡ Agregar al evento</button>
        </div>
    </div>
</div>

<script>
(function(){
    const t = localStorage.getItem('access_token');
    const u = JSON.parse(localStorage.getItem('user') || '{}');
    // Operadores asignados como checkin también pueden acceder.
    // Coordinadores con cupos también usan esta vista (reportar novedades/vetos).
    if (!t || !['checkin', 'intendencia', 'superadmin', 'admin', 'operator'].includes(u.user_type)) {
        location.href = '/admin/login';
        return;
    }
    document.getElementById('userName').textContent = u.first_name + ' ' + u.last_name;
    const badge = document.getElementById('roleBadge');
    const roleMap = {
        checkin: {text: 'Check-in', bg: 'bg-green-600'},
        intendencia: {text: 'Intendencia', bg: 'bg-emerald-600'},
        superadmin: {text: 'Superadmin', bg: 'bg-purple-600'},
        operator: {text: 'Operador', bg: 'bg-blue-600'},
        coordinator: {text: 'Coordinador', bg: 'bg-amber-600'},
    };
    const r = roleMap[u.user_type] || roleMap.checkin;
    badge.textContent = r.text;
    badge.className = 'text-xs px-2 py-0.5 rounded-full font-semibold text-white ' + r.bg;
    loadEvents();
})();

const _eventsById = {};
let _qaEventId = null;

function authH() { return {'Authorization': 'Bearer ' + localStorage.getItem('access_token')}; }

async function loadEvents() {
    const container = document.getElementById('eventsList');
    // user_type se necesita para mostrar/ocultar el botón de Incidencias
    // (solo superadmin). Se lee aquí para no depender del scope de la IIFE.
    const u = JSON.parse(localStorage.getItem('user') || '{}');
    try {
        const res = await fetch('/api/events/my-events/staff', {headers: authH()});
        if (!res.ok) {
            container.innerHTML = '<p class="text-center text-red-500 py-8">Error al cargar eventos</p>';
            return;
        }
        const events = await res.json();
        if (!events.length) {
            container.innerHTML = '<div class="bg-white rounded-lg shadow p-8 text-center text-gray-400"><p class="text-lg">📭 No tienes eventos asignados todavía.</p><p class="text-sm mt-2">Contacta al coordinador para que te asigne a un evento.</p></div>';
            return;
        }
        container.innerHTML = events.map(e => {
            const dt = e.start_date ? new Date(e.start_date).toLocaleDateString('es-CO', {weekday:'short', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : 'N/A';
            const statusMap = {draft:'Borrador', published:'Publicado', in_progress:'En curso', completed:'Completado', cancelled:'Cancelado'};
            const statusCls = {draft:'bg-gray-100 text-gray-700', published:'bg-blue-100 text-blue-700', in_progress:'bg-green-100 text-green-700', completed:'bg-gray-100 text-gray-500', cancelled:'bg-red-100 text-red-700'};
            const st = statusMap[e.status] || e.status;
            const sc = statusCls[e.status] || '';
            const btns = [];
            _eventsById[e.id] = e.name;
            // Intendencia quedó fusionada en Check-in (que incluye gestión de
            // indumentaria). Cualquier rol de staff accede por el mismo botón.
            if (['checkin', 'intendencia', 'superadmin'].includes(e.staff_role)) {
                btns.push(`<a href="/admin/events/${e.id}/checkin" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700">✅ Check-in e Indumentaria</a>`);
            }
            // ⚡ Incorporación Rápida: disponible para el rol Check-in (e
            // Indumentaria) y admins, junto al botón de Check-in.
            if (['checkin', 'intendencia', 'superadmin'].includes(e.staff_role) || u.user_type === 'superadmin' || u.user_type === 'admin') {
                btns.push(`<button onclick="showQuickAddModal('${e.id}')" class="inline-block bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-teal-700">⚡ Incorporación Rápida</button>`);
            }
            // Incidencias y vetos: superadmin o coordinador (con cupo en el evento).
            if (u.user_type === 'superadmin' || u.user_type === 'admin') {
                btns.push(`<a href="/admin/events/${e.id}/incidencias" class="inline-block bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700">⚠️ Incidencias</a>`);
            }
            return `<div class="bg-white rounded-lg shadow p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h3 class="font-semibold text-gray-800">${e.name}</h3>
                    <p class="text-sm text-gray-500">📍 ${e.location}</p>
                    <p class="text-xs text-gray-400">🕒 ${dt}</p>
                </div>
                <div class="flex flex-col items-start sm:items-end gap-2">
                    <span class="text-xs px-2 py-1 rounded-full font-semibold ${sc}">${st}</span>
                    <div class="flex gap-2">${btns.join('')}</div>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        container.innerHTML = '<p class="text-center text-red-500 py-8">Error de conexión</p>';
    }
}

// ============================================================
// ⚡ INCORPORACIÓN RÁPIDA (mismo flujo que event_detail)
// ============================================================
function showToast(msg, isErr) {
    let t = document.getElementById('qaToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'qaToast';
        t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm text-white shadow-lg z-[60] transition-opacity';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = isErr ? '#dc2626' : '#16a34a';
    t.style.opacity = '1';
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

function showQuickAddModal(eventId) {
    _qaEventId = eventId;
    ['qaPrimerNombre', 'qaSegundoNombre', 'qaPrimerApellido', 'qaSegundoApellido', 'qaDocNumber'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('qaDocType').value = 'CC';
    document.getElementById('qaEventName').textContent = _eventsById[eventId] ? 'Evento: ' + _eventsById[eventId] : '';
    document.getElementById('quickAddModal').classList.remove('hidden');
    document.getElementById('qaPrimerNombre').focus();
}

function closeQuickAddModal() { document.getElementById('quickAddModal').classList.add('hidden'); }

async function submitQuickAdd() {
    const primer_nombre = document.getElementById('qaPrimerNombre').value.trim();
    const primer_apellido = document.getElementById('qaPrimerApellido').value.trim();
    const document_number = document.getElementById('qaDocNumber').value.trim();
    if (!primer_nombre || !primer_apellido || !document_number) { showToast('Nombre, apellido y documento son obligatorios', true); return; }
    const btn = document.getElementById('btnQuickAdd');
    btn.disabled = true; btn.textContent = 'Agregando…';
    try {
        const res = await fetch(`/api/events/${_qaEventId}/quick-add`, {
            method: 'POST',
            headers: { ...authH(), 'Content-Type': 'application/json' },
            body: JSON.stringify({
                primer_nombre: primer_nombre,
                segundo_nombre: document.getElementById('qaSegundoNombre').value.trim() || null,
                primer_apellido: primer_apellido,
                segundo_apellido: document.getElementById('qaSegundoApellido').value.trim() || null,
                document_type: document.getElementById('qaDocType').value,
                document_number: document_number,
            })
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) { showToast(d.detail || 'Error al agregar', true); return; }
        const modeTxt = d.mode === 'existing' ? '(operador ya registrado)' : '(solo evento)';
        showToast(`✅ ${d.full_name} agregado y confirmado ${modeTxt}`);
        closeQuickAddModal();
    } catch (e) {
        showToast('Error: ' + e.message, true);
    } finally {
        btn.disabled = false; btn.textContent = '⚡ Agregar al evento';
    }
}
</script>
</body>
