upstream backend {
    server backend:8000;
}

# ===== Gzip (rendimiento / Core Web Vitals) =====
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml
    font/woff2;

# Cloudflare IP ranges (IPv4) — necessary for real client IP
# Updated: https://www.cloudflare.com/ips-v4/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IP ranges (IPv6)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# HTTP → HTTPS (canónico sin www)
server {
    listen 80;
    server_name ayceventos.com.co www.ayceventos.com.co;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ayceventos.com.co$request_uri;
    }
}

# www → no-www (301 permanente, evita contenido duplicado en buscadores)
server {
    listen 443 ssl;
    http2 on;
    server_name www.ayceventos.com.co;

    ssl_certificate /etc/letsencrypt/live/ayceventos.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayceventos.com.co/privkey.pem;

    return 301 https://ayceventos.com.co$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ayceventos.com.co;

    # SSL certs (auto-generated by certbot)
    ssl_certificate /etc/letsencrypt/live/ayceventos.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayceventos.com.co/privkey.pem;

    # SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: incluye Google Fonts y Google Analytics (GA4, solo si GA_MEASUREMENT_ID está activo)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://ayceventos.com.co https://ayceventos.com.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Max upload size (photos)
    client_max_body_size 10M;

    # Static frontend files (landing, admin)
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoints — Tiempo real (check-in, intendencia, nómina)
    # ⚠️ Requiere HTTP/1.1 + cabeceras Upgrade/Connection + timeouts largos.
    #    Cloudflare soporta WS automáticamente (sin config extra en dashboard).
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts largos: WS es conexión persistente (no cerrar por inactividad)
        proxy_read_timeout 86400s;   # 24h
        proxy_send_timeout 86400s;   # 24h
        proxy_connect_timeout 60s;
    }

    # API endpoints
    # NOTA: la importación masiva de operadores (/import-operators) responde
    # 202 inmediato con job_id y se procesa en background; el frontend consulta
    # el progreso con GET /api/events/import/status/{job_id} (requests cortos),
    # por lo que 120s de read_timeout es más que suficiente para todo /api/.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WhatsApp webhook (needs longer timeout)
    location /webhook/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Recursos estáticos del frontend (JS/CSS/imágenes de la landing).
    # Servidos por el backend pero con caché de navegador agresiva (inmutables por build).
    location /static/frontend/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Photo files
    location /data/photos/ {
        alias /app/data/photos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes de contenido de la home (servicios, galería, noticias, hero, escenarios).
    # Servidas directamente por nginx (sin pasar por FastAPI) para mejor rendimiento.
    location /static/content/ {
        alias /app/data/static/content/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PDFs de RUT de operadores (registro de proveedores).
    location /static/rut/ {
        alias /app/data/rut/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cédulas de operadores (fotos frente/dorso, WebP). Nombres de archivo
    # incluyen el UUID del usuario (no enumerables).
    location /static/id_docs/ {
        alias /app/data/id_docs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}